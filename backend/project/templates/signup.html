{% extends "base.html" %}

{% block content %}
<div class="column is-4 is-offset-4">
    <h3 class="title">Sign Up</h3>
    <div class="box">
{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="notification is-danger">
            {{ messages[0] }}. Go to <a href="{{ url_for('auth.login') }}">login page</a>.
        </div>
    {% endif %}
{% endwith %}

<form method="POST" action="/signup">
    <div class="field">
        <label class="label" for="signup-email">Email</label>
        <div class="control">
            <input id="signup-email" class="input is-large" type="email" name="email" placeholder="Email" autofocus required>
        </div>
    </div>

    <button type="submit" class="button is-block is-info is-large is-fullwidth">Continue</button>
</form>
    </div>
</div>
{% endblock %}
